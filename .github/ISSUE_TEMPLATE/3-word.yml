name: Suggest a word
description: Something you need to do that simplydata has no word for yet.
title: "Word idea: "
labels: ["word idea"]
body:
  - type: textarea
    id: task
    attributes:
      label: What do you want to do?
      description: Describe the task in plain words, as you would say it to a colleague.
      placeholder: "I want to compare the averages of three groups that were measured on the same people."
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: In pandas, Polars, R, SPSS, Excel or anything else (optional).
    validations:
      required: false
  - type: input
    id: name
    attributes:
      label: A name you would expect (optional)
      placeholder: "table.compare_repeated_averages_of(...)"
    validations:
      required: false
