name: upcoming-versions

# Every Monday: the tests without R on the newest releases AND pre-releases of the packages simplydata
# passes work to, so a coming change is seen before users meet it (MAINTAINING.md). Never a required check.
# On a failure it opens or updates ONE issue; when the run passes again it comments on that issue and closes it.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/upcoming-versions.yml  # only to try a change to this file; no issue is touched then

permissions:
  contents: read
  issues: write

env:
  ISSUE_TITLE: Upcoming package versions break simplydata

jobs:
  upcoming-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install simplydata, then the newest releases and pre-releases
        # The second install deliberately ignores the upper bounds in pyproject.toml: the point is to try
        # the next major releases before simplydata allows them.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,systems,files,sql,web,xarray,exact]"
          python -m pip install --pre --upgrade pandas numpy scipy statsmodels matplotlib seaborn polars plotly sympy
      - name: Record the versions
        run: |
          python -m pip list 2>/dev/null | grep -iE '^(pandas|numpy|scipy|statsmodels|matplotlib|seaborn|polars|narwhals|pyarrow|plotly|sympy) ' > versions.txt
          cat versions.txt
          { echo '### Versions tried'; echo '```'; cat versions.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Run tests
        id: tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -n auto --dist loadgroup -rfE -p no:cacheprovider 2>&1 | tee pytest.log
        env:
          MPLBACKEND: Agg
          SIMPLYDATA_NO_R: "1"
          SIMPLYDATA_REQUIRE_CONTROL: "1"
          SIMPLYDATA_REQUIRE_PLOTLY: "1"
          SIMPLYDATA_REQUIRE_SYMPY: "1"
      - name: Open or update the warning issue
        if: failure() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = f => fs.existsSync(f) ? fs.readFileSync(f, 'utf8') : '';
            const versions = read('versions.txt').trim() || '(not recorded: the install failed)';
            const failed = read('pytest.log').split('\n').filter(l => /^(FAILED|ERROR) /.test(l))
              .map(l => l.split(' - ')[0]);  // test names only, never an error message
            const shown = failed.slice(0, 100).join('\n') || '(no test names: see the run log)';
            const more = failed.length > 100 ? `\n... and ${failed.length - 100} more` : '';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The weekly run on the newest releases and pre-releases failed on ${new Date().toISOString().slice(0, 10)}.`,
              `Run: ${run}`, '', '**Versions tried**', '```', versions, '```', '',
              `**Failing tests (${failed.length})**`, '```', shown + more, '```', '',
              'How to read and fix this: MAINTAINING.md, "Warning issues".',
            ].join('\n');
            const title = process.env.ISSUE_TITLE;
            const open = await github.paginate(github.rest.issues.listForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
            const issue = open.find(i => i.title === title && !i.pull_request);
            if (issue) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, body });
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, body: `Still failing: ${run} (${failed.length} failing tests; the issue text is updated).` });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }
      - name: Close the warning issue
        if: success() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const title = process.env.ISSUE_TITLE;
            const open = await github.paginate(github.rest.issues.listForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            for (const issue of open.filter(i => i.title === title && !i.pull_request)) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, body: `The tests pass again on the newest releases and pre-releases: ${run}. Closing.` });
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: 'closed' });
            }
