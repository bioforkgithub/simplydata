name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # R for the methods that only R gives (simplydata[r]): cox.zph, k-means, NMDS, betadisper, ...
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install R packages
        run: Rscript -e 'install.packages(c("survival", "vegan", "mice", "lme4"), repos = "https://cloud.r-project.org")'
      - name: Tell rpy2 where R is
        shell: bash
        run: echo "R_HOME=$(Rscript -e 'cat(normalizePath(R.home(), winslash = "/"))')" >> "$GITHUB_ENV"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,r]"
      - name: Run tests
        run: python -m pytest -q
        env:
          MPLBACKEND: Agg
          SIMPLYDATA_REQUIRE_R: "1"  # in CI the R tests must run, never be skipped
