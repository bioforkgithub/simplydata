# Weekly update pull requests for the version ranges in pyproject.toml and for the GitHub Actions used in
# .github/workflows. Every update of the week comes in ONE pull request per ecosystem (minor, patch and major
# together), so the full test matrix runs once a week instead of once per package. A major release still means
# widening a range by hand where needed (MAINTAINING.md); its name is listed in the grouped pull request.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    versioning-strategy: auto  # for a library, auto widens the range (dependabot has no "widen" value)
    groups:
      python-all:
        patterns: ["*"]
        update-types: [major, minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      actions-all:
        patterns: ["*"]
        update-types: [major, minor, patch]
