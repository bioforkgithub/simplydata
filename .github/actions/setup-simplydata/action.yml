name: Set up simplydata for the docs rebuild
description: >-
  Python 3.12 and simplydata (editable), and with r=true also R with every R package of tests/conftest.py (R_PACKAGES,
  R_PACKAGES_HEAVY; qvalue from Bioconductor), installed as in tests.yml. Used by .github/workflows/rebuild-docs.yml.
inputs:
  r:
    description: "true: install R and the R packages"
    default: "false"
  extras:
    description: the pip extras of simplydata
    default: "test,systems,sql,web,xarray,exact"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: pyproject.toml
    - if: inputs.r == 'true'
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: release
        use-public-rspm: true
    # The same system libraries as tests.yml
    - if: inputs.r == 'true'
      name: Install system libraries for R
      shell: bash
      run: >-
        sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libuv1-dev libssl-dev libxml2-dev
        libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev
        libudunits2-dev libgdal-dev libgeos-dev libproj-dev libgmp-dev libmpfr-dev libglpk-dev cmake
    # The package list is read from tests/conftest.py, so it never drifts from the tests' list
    - if: inputs.r == 'true'
      id: rlist
      name: Read the R package list
      shell: bash
      run: |
        python - <<'PY' >> "$GITHUB_OUTPUT"
        import ast, hashlib, pathlib
        tree = ast.parse(pathlib.Path("tests/conftest.py").read_text(encoding="utf-8"))
        found = {}
        for node in tree.body:
            if isinstance(node, ast.Assign) and isinstance(node.targets[0], ast.Name):
                if node.targets[0].id in ("R_PACKAGES", "R_PACKAGES_HEAVY"):
                    found[node.targets[0].id] = ast.literal_eval(node.value)
        cran = [p for p in dict.fromkeys(found["R_PACKAGES"] + found["R_PACKAGES_HEAVY"]) if p != "qvalue"]
        print("cran=" + ",".join(cran))
        # the same hash as tests.yml, so the Linux test jobs and the docs rebuild share one kept R library
        light = {p for p in found["R_PACKAGES"] if p != "qvalue"}
        names = ",".join(sorted(light)) + "|" + ",".join(sorted(set(found["R_PACKAGES_HEAVY"]))) + "|qvalue"
        print("hash=" + hashlib.sha256(names.encode()).hexdigest()[:16])
        PY
        echo "rversion=$(Rscript -e 'cat(as.character(getRversion()))')" >> "$GITHUB_OUTPUT"
        echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
    # Installed R packages are kept for a week (then the latest CRAN versions are installed again); the key is the
    # same as in tests.yml (a hash of the package list, not of the whole conftest.py)
    - if: inputs.r == 'true'
      uses: actions/cache@v4
      with:
        path: ${{ env.R_LIBS_USER }}
        key: rlib-${{ runner.os }}-${{ steps.rlist.outputs.rversion }}-${{ steps.rlist.outputs.week }}-${{ steps.rlist.outputs.hash }}
        restore-keys: rlib-${{ runner.os }}-${{ steps.rlist.outputs.rversion }}-${{ steps.rlist.outputs.week }}-
    - if: inputs.r == 'true'
      name: Install R packages
      shell: bash
      env:
        PKGS: ${{ steps.rlist.outputs.cran }}
      run: >-
        Rscript -e 'pkgs <- strsplit(Sys.getenv("PKGS"), ",")[[1]];
        missing <- setdiff(pkgs, rownames(installed.packages())); cat("installing:", missing, "\n");
        if (length(missing)) install.packages(missing);
        if (!requireNamespace("qvalue", quietly = TRUE)) { install.packages("BiocManager");
        tryCatch(BiocManager::install("qvalue", update = FALSE, ask = FALSE), error = function(e)
        BiocManager::install("qvalue", version = "devel", update = FALSE, ask = FALSE)) };
        for (p in c(pkgs, "qvalue")) library(p, character.only = TRUE)'
    - if: inputs.r == 'true'
      name: Tell rpy2 where R is
      shell: bash
      run: echo "R_HOME=$(Rscript -e 'cat(normalizePath(R.home(), winslash = "/"))')" >> "$GITHUB_ENV"
    - name: Install simplydata
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[${{ inputs.extras }}]"
        python -m pip freeze > "$RUNNER_TEMP/pip-freeze.txt"
