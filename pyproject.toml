[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "simplydata"
dynamic = ["version"]
description = "Simple words for data science in Python: data cleaning, tables, charts and statistics, built on pandas, Polars, NumPy, SciPy, matplotlib and seaborn."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "bioforkgithub" }]
keywords = ["data science", "statistics", "plotting", "visualisation", "data cleaning", "education", "pandas", "polars", "numpy", "matplotlib", "seaborn"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Visualization",
    "Framework :: Matplotlib",
]
dependencies = [
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.16",
    "statsmodels>=0.14",
    "openpyxl>=3.1",
    "narwhals>=2.0",
]

[project.optional-dependencies]
fast = ["polars>=0.20", "pyarrow>=14"]
files = ["python-docx>=1.1", "pyreadstat>=1.2"]
stats = []  # kept so that pip install "simplydata[stats]" still works; statsmodels is now required
systems = ["control>=0.10.1"]  # python-control: rise time, settling time, overshoot and margins of systems
r = ["rpy2>=3.5"]  # the bridge to R for the methods only R gives (R itself: https://cran.r-project.org)
# R packages the [r] words call are installed in R itself (tests/conftest.py R_PACKAGES). S3a-2 (lines and curves)
# adds drc (fit_dose_response), segmented (fit_line(with_bends=)), smatr and mcr (fit_line(method=)) and quantreg
# (explain(for_percentile=)); stats::loess and car come with R or are listed already. All are on CRAN and conda-forge.
test = ["pytest>=7", "polars>=0.20", "pyarrow>=14", "statsmodels>=0.14"]

[project.urls]
Homepage = "https://github.com/bioforkgithub/simplydata"
Issues = "https://github.com/bioforkgithub/simplydata/issues"
Changelog = "https://github.com/bioforkgithub/simplydata/blob/main/CHANGELOG.md"
Manual = "https://github.com/bioforkgithub/simplydata/blob/main/docs/manual/simplydata_manual.pdf"

[tool.hatch.version]
path = "src/simplydata/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src/simplydata", "tests", "validation", "README.md", "LICENSE", "CHANGELOG.md", "CITATION.cff", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/simplydata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
