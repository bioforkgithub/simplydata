[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "simplydata"
dynamic = ["version"]
description = "Learn basic Python, and simplydata takes you from your first table to sound statistics, in plain words, with its results checked against the field's standard tools."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "DATA_LICENSES.md"]
requires-python = ">=3.11"
authors = [{ name = "bioforkgithub" }]
keywords = ["data science", "statistics", "plotting", "visualisation", "data cleaning", "education", "pandas", "polars", "numpy", "matplotlib", "seaborn"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Visualization",
    "Framework :: Matplotlib",
]
# Supported version ranges (MAINTAINING.md): the lower bound is the oldest release CI tests
# (.github/workflows/oldest-versions.yml), the upper bound the next untested major release.
dependencies = [
    # Lower bound 3.11 (charts phase, 2026-11-25): set_hatchcolor, so a pattern on a dark fill is drawn in white;
    # in 3.10 a pattern always takes the edge colour, so black-and-white charts (black edges) hid it on dark greys.
    "matplotlib>=3.11,<4",
    "seaborn>=0.13.2,<0.14",
    "pandas>=3.0.6,<4",
    # Lower bound 2.1 (numbers phase, 2026-11-26): np.unstack, which block.split_into_one_block_per uses and names.
    "numpy>=2.1,<3",
    "scipy>=1.17,<2",
    "statsmodels>=0.15,<0.16",
    "openpyxl>=3.1.5,<4",
    "narwhals>=2.29.0,<3",
    # Polars and pyarrow are required since the tables phase (Manish, 2026-11-25): several table words run on Polars
    # for every table, so that pandas and Polars tables give one answer. Lower bound 1.43.2: Polars 1.37 to 1.42
    # panic in str.strptime("%d %B %Y") on a short month name (turn_into_dates(written_like=)), and before 1.40 a
    # pivot drops the values of an empty name (the oldest-versions run of 2026-11-25).
    "polars>=1.43.2,<3",
    "pyarrow>=19,<27",
]

[project.optional-dependencies]
fast = []  # kept so that pip install "simplydata[fast]" still works; Polars and pyarrow are now required
files = ["python-docx>=1.1,<2", "pyreadstat>=1.2.8,<2"]
stats = []  # kept so that pip install "simplydata[stats]" still works; statsmodels is now required
systems = ["control>=0.10.1,<0.11"]  # python-control: rise time, settling time, overshoot and margins of systems
# DuckDB for SQL (table.run_sql, sdata.run_sql) and .duckdb files; simplydata opens it with no extensions and no web
# access (src/simplydata/_sql.py). Lower bound: the release CI tests; upper bound: the next untested major release.
sql = ["duckdb>=2.0,<3"]
# plotly for web pages: chart.save("marks.html") and chart.show_in_web_page() (charts phase, batch 3). The picture
# is drawn by matplotlib and copied into plotly, and plotly.js goes inside the page; kaleido is not needed. Lower
# bound: the release CI tests; upper bound: the next untested major release.
web = ["plotly>=6.0,<8"]
# xarray lines up blocks of numbers by the names of their directions, and chooses by labels (keep_where); NumPy does
# the same job without it (NumPy + SciPy phase, batch 1, decision 1 approved by Manish 2026-11-25). Lower bound: a
# release with NumPy 2 support that pandas 3 accepts (pandas 3.0 refuses xarray older than 2024.10.0 in
# to_xarray, found by the oldest-versions CI job); upper bound: the next untested year of releases.
# NumPy + SciPy phase, batch 2 (decision 3, approved by Manish 2026-11-25): netCDF files (sdata.number_block("sst.nc"),
# block.save("out.nc"), sdata.show_whats_inside) read and write netCDF-4 with h5netcdf, which needs h5py; both have
# wheels for Windows, macOS and Linux. Classic netCDF-3 files are read by SciPy's own engine (scipy is required).
xarray = ["xarray>=2024.10,<2027", "h5netcdf>=1.4,<2", "h5py>=3.11,<4"]
# SymPy for exact maths: sdata.formula(...) and its words, sdata.solve(exactly=True), find_area_under(exactly=True),
# find_path_over_time(exactly=True) and show_as_fraction (numbers phase, batch 3). Lower bound 1.14 (numbers phase,
# batch 4, 2026-11-27): SymPy 1.13 cannot pickle an unknown function such as N(t), so the exact path over time could
# not reach the time-limited helper, and its parser recurses differently on long sums (oldest-versions CI job);
# upper bound: the next untested major release.
exact = ["sympy>=1.14,<2"]
r = ["rpy2>=3.5,<4"]  # the bridge to R for the methods only R gives (R itself: https://cran.r-project.org)
# R packages the [r] words call are installed in R itself (tests/conftest.py R_PACKAGES). S3a-2 (lines and curves)
# adds drc (fit_dose_response), segmented (fit_line(with_bends=)), smatr and mcr (fit_line(method=)) and quantreg
# (explain(for_percentile=)); stats::loess and car come with R or are listed already. All are on CRAN and conda-forge.
# S3a-3 (checking and comparing) calls the R packages nlme (explain(spread_changes_with=,
# neighbours_alike_in_order_of=)), glmnet (find_columns_that_predict) and boot (compare_models(check_on_left_out_rows=)),
# besides emmeans, lme4 and performance, listed already; lmtest and AICcmodavg are used by the reliability study only.
# S3b-3 (survival and person-time) calls cmprsk (Gray's test, Fine-Gray), adjustedCurves with riskRegression (adjusted
# curves), KMsurv (life table) and survRM2 (restricted mean survival time; CRAN only, like presize), besides survival.
# S3b-1 (combining studies) calls the R package metafor (with its data package metadat); meta is used by the
# reliability study only. Both are on CRAN and conda-forge.
# S3b-2 (planning a study) calls gsDesign (events for survival, Schoenfeld), powerSurvEpi (people for survival; Freedman)
# and pwrss (logistic regression; CRAN only, like presize), besides presize, listed already.
# S3c-1 (communities and resistomes) calls vegan, zCompositions, compositions and ca, and the recommended packages
# cluster and MASS that come with R; all are on CRAN and conda-forge.
# S3c-2 (hidden factors) calls psych (listed already) with GPArotation for the rotations, and lavaan; both on CRAN
# and conda-forge.
# S3c-3 (directions, places and extremes) calls circular (Rayleigh test), spdep with sf (Moran's I), gstat (variogram)
# and extRemes (return levels); ismev, sp and ape are used by the reliability study only. All are on CRAN and
# conda-forge. Moran's I runs in R spdep rather than Python esda/libpysal, which would add geopandas, pyproj, pyogrio,
# shapely, scikit-learn and requests (about 110 MB of wheels) as new Python dependencies.
# S3c-4 (small additions) calls qvalue (Storey's q-values and the local false discovery rate), which is on
# Bioconductor, not CRAN or conda-forge: in R, install.packages("BiocManager") and then install qvalue with it; with
# conda, bioconductor-qvalue from bioconda. PMCMRplus (Nemenyi and Conover after Friedman) and forecast
# (auto.arima) are listed already.
# S3d-2 (epidemiology and cause and effect) calls WeightIt, MatchIt and cobalt (propensity scores, weighting, matching
# and balance tables; with sandwich and lmtest, listed already), miceadds (correlations pooled after multiple
# imputation) and epiR (attributable fractions and standardised rates, listed already); epitools is used by the
# reliability study only. All are on CRAN and conda-forge. Mediation (statsmodels) and the 2 x 2 crossover
# (statsmodels) need no R.
# S3d-1 (planning and surveys) calls agricolae (design tables), blockrand (randomisation lists; CRAN only, not on
# conda-forge) and survey (survey-weighted answers); agricolae and survey are on conda-forge. mice (patterns of empty
# cells, in the reliability study) is listed already.
# S3d-3 (Bayesian methods) calls BayesFactor (Bayes factors; on conda-forge as r-bayesfactor) and, for Bayesian models,
# rstanarm, rstan and posterior (on conda-forge as r-rstanarm, r-rstan and r-posterior). rstanarm is large (about 400
# MB with Stan); in R install it as a ready-made build: install.packages("rstanarm", type = "binary") on Windows and
# macOS, or from Posit's public package manager on Linux. Without it only the bayesian=True model words stop, with
# the install line.
# data-and-fixes: the reliability study reads the tables of GPL and LGPL R packages from the installed packages
# instead of stored copies (validation/r_data.py), so the tests also use AER, alr4, HH and mediation (CRAN).
# tzdata: IANA's main time zone data (what simplydata reads through Polars) for Python's zoneinfo on every system;
# the reliability study's pandas reference for Oslo before 1970 reads it (validation/cases_underneath_tables_2.py)
test = ["pytest>=7,<10", "statsmodels>=0.15,<0.16", "jedi>=0.19,<1", "tzdata>=2023.3,<2028"]

[project.urls]
Homepage = "https://github.com/bioforkgithub/simplydata"
Issues = "https://github.com/bioforkgithub/simplydata/issues"
Changelog = "https://github.com/bioforkgithub/simplydata/blob/main/CHANGELOG.md"
Manual = "https://github.com/bioforkgithub/simplydata/blob/main/docs/manual/simplydata_manual.pdf"

[tool.hatch.version]
path = "src/simplydata/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src/simplydata", "tests", "validation", "docs/make_job_search.py", "docs/make_practice_tables.py", "docs/make_fjord_tables.py", "README.md", "LICENSE", "DATA_LICENSES.md", "CHANGELOG.md",
           "CITATION.cff", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/simplydata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
