[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "simplydata"
dynamic = ["version"]
description = "Learn basic Python, and simplydata takes you from your first table to publication-ready statistics, in plain words, with every number checked against the field's standard tools."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "bioforkgithub" }]
keywords = ["data science", "statistics", "plotting", "visualisation", "data cleaning", "education", "pandas", "polars", "numpy", "matplotlib", "seaborn"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Visualization",
    "Framework :: Matplotlib",
]
dependencies = [
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.16",
    "statsmodels>=0.14",
    "openpyxl>=3.1",
    "narwhals>=2.0",
]

[project.optional-dependencies]
fast = ["polars>=0.20", "pyarrow>=14"]
files = ["python-docx>=1.1", "pyreadstat>=1.2"]
stats = []  # kept so that pip install "simplydata[stats]" still works; statsmodels is now required
systems = ["control>=0.10.1"]  # python-control: rise time, settling time, overshoot and margins of systems
r = ["rpy2>=3.5"]  # the bridge to R for the methods only R gives (R itself: https://cran.r-project.org)
# R packages the [r] words call are installed in R itself (tests/conftest.py R_PACKAGES). S3a-2 (lines and curves)
# adds drc (fit_dose_response), segmented (fit_line(with_bends=)), smatr and mcr (fit_line(method=)) and quantreg
# (explain(for_percentile=)); stats::loess and car come with R or are listed already. All are on CRAN and conda-forge.
# S3a-3 (checking and comparing) calls the R packages nlme (explain(spread_changes_with=,
# neighbours_alike_in_order_of=)), glmnet (find_columns_that_predict) and boot (compare_models(check_on_left_out_rows=)),
# besides emmeans, lme4 and performance, listed already; lmtest and AICcmodavg are used by the reliability study only.
# S3b-3 (survival and person-time) calls cmprsk (Gray's test, Fine-Gray), adjustedCurves with riskRegression (adjusted
# curves), KMsurv (life table) and survRM2 (restricted mean survival time; CRAN only, like presize), besides survival.
# S3b-1 (combining studies) calls the R package metafor (with its data package metadat); meta is used by the
# reliability study only. Both are on CRAN and conda-forge.
# S3b-2 (planning a study) calls gsDesign (events for survival, Schoenfeld), powerSurvEpi (people for survival; Freedman)
# and pwrss (logistic regression; CRAN only, like presize), besides presize, listed already.
# S3c-1 (communities and resistomes) calls vegan, zCompositions, compositions and ca, and the recommended packages
# cluster and MASS that come with R; all are on CRAN and conda-forge.
# S3c-3 (directions, places and extremes) calls circular (Rayleigh test), spdep with sf (Moran's I), gstat (variogram)
# and extRemes (return levels); ismev, sp and ape are used by the reliability study only. All are on CRAN and
# conda-forge. Moran's I runs in R spdep rather than Python esda/libpysal, which would add geopandas, pyproj, pyogrio,
# shapely, scikit-learn and requests (about 110 MB of wheels) as new Python dependencies.
test = ["pytest>=7", "polars>=0.20", "pyarrow>=14", "statsmodels>=0.14"]

[project.urls]
Homepage = "https://github.com/bioforkgithub/simplydata"
Issues = "https://github.com/bioforkgithub/simplydata/issues"
Changelog = "https://github.com/bioforkgithub/simplydata/blob/main/CHANGELOG.md"
Manual = "https://github.com/bioforkgithub/simplydata/blob/main/docs/manual/simplydata_manual.pdf"

[tool.hatch.version]
path = "src/simplydata/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src/simplydata", "tests", "validation", "README.md", "LICENSE", "CHANGELOG.md", "CITATION.cff", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/simplydata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
